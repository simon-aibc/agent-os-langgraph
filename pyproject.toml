[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os-langgraph"
version = "1.1.2"
description = "Deterministic multi-agent orchestration built with LangGraph."
readme = "README.md"
authors = [{ name = "Simon Tran" }]
license = "MIT"
keywords = [
    "agents",
    "coding-agent",
    "human-in-the-loop",
    "langgraph",
    "mcp",
    "multi-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.0",
    "langchain==1.3.14",
    "langchain-core==1.4.9",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "typing-extensions==4.16.0",
    "langchain-litellm==0.7.0",
    "litellm==1.93.0",
    "mcp==1.29.0",
    "langchain-mcp-adapters==0.3.0",
    "rich==15.0.0",
]

[project.scripts]
agent-os = "agent_os.__main__:main"

[project.urls]
Homepage = "https://github.com/simon-aibc/agent-os-langgraph"
Documentation = "https://github.com/simon-aibc/agent-os-langgraph#readme"
Repository = "https://github.com/simon-aibc/agent-os-langgraph.git"
Changelog = "https://github.com/simon-aibc/agent-os-langgraph/blob/main/CHANGELOG.md"
Issues = "https://github.com/simon-aibc/agent-os-langgraph/issues"

[tool.setuptools.packages.find]
include = ["agent_os*"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: requires explicitly enabled external services or CLI tools",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".ruff_cache",
    ".pytest_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
