name: agent-os

services:
  backend:
    build:
      context: .
    ports:
      - "127.0.0.1:4680:4680"
    volumes:
      - agentos_data:/data
      - ${AGENT_OS_WORKSPACE:-.}:/workspace
    environment:
      - LLM_ROUTER
      - LLM_ARCHITECT
      - LLM_EXECUTOR
      - AGENT_OS_CORS_ORIGINS
      - AGENT_OS_CHECKPOINTS_DB=/data/checkpoints.db
      - AGENT_OS_SCHED_DB=/data/checkpoints.sched.db
      - AGENT_OS_SCHEDULER_ENABLED
      - AGENT_OS_SCHED_TICK_SECONDS
      - AGENT_OS_SANDBOX=/workspace
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:4680/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  console:
    image: ghcr.io/simon-aibc/agent-os-console@sha256:1e2b8b29fa0ae866e8be2a1c9d3162b013a4a1cd12ffac57abd24c5ccf7ebd57
    ports:
      - "127.0.0.1:4100:4100"
    environment:
      - AGENT_OS_API_BASE=http://127.0.0.1:4680
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  agentos_data:
